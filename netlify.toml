# Despliegue del frontend en Netlify.
# Netlify actúa como proxy hacia la API en Render: el navegador ve un solo dominio,
# así la cookie del refresh token funciona sin cambios y no hay problemas de CORS.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "/api"

[[redirects]]
  from   = "/api/*"
  to     = "https://galacticos-tickets.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/admin/*"
  to     = "https://galacticos-tickets.onrender.com/admin/:splat"
  status = 200
  force  = true

# React Router: cualquier otra ruta carga la SPA
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
